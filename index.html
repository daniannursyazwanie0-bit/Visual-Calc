<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VISUAL LAB</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <strong>VISUAL LAB</strong>
    </div>

    <nav id="subjects">
      <button class="subject active" data-subject="math">MATHEMATICS</button>
      <button class="subject" data-subject="physics">PHYSICS</button>
      <button class="subject" data-subject="chemistry">CHEMISTRY</button>
      <button class="subject" data-subject="engineering">ENGINEERING</button>
    </nav>
  </header>

  <main class="layout">

    <aside class="sidebar">
      <div class="side-title">CHAPTERS</div>
      <div id="chapterList"></div>
    </aside>

    <section class="workspace">

      <div class="chapter-head">
        <div>
          <div class="eyebrow" id="subjectName">MATHEMATICS</div>
          <h1 id="chapterName">Differentiation</h1>
          <p id="chapterDescription">
            Move the point and watch the tangent change.
          </p>
        </div>

        <button id="resetBtn" class="reset">RESET</button>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="visual">VISUAL</button>
        <button class="tab" data-tab="calculation">CALCULATION</button>
        <button class="tab" data-tab="why">WHY?</button>
        <button class="tab" data-tab="practice">PRACTICE</button>
      </div>

      <div class="lab">

        <div class="simulation">
          <canvas id="canvas"></canvas>

          <div class="graph-label" id="graphLabel">
            f(x)
          </div>
        </div>

        <aside class="controls-panel">
          <div class="panel-title">CONTROLS</div>
          <div id="controls"></div>

          <div class="readout">
            <div class="readout-label">LIVE</div>
            <div id="readout"></div>
          </div>
        </aside>

      </div>

      <section class="info-panel">
        <div id="info"></div>
      </section>

    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
